name: official-staging

# Automatic official-staging deployment after green checks on the
# official-staging git branch. GitHub Environment name is staging
# (auto, no required reviewer). Git branch official-staging is not
# GitHub Environment staging. Production remains disabled.
# Upload is wrangler versions upload (inactive candidate). Activation is
# wrangler versions deploy VERSION@100% after structured candidate gates.
on:
  push:
    branches: [official-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-staging
  cancel-in-progress: false

jobs:
  refuse-other-refs:
    if: github.ref != 'refs/heads/official-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-release refs
        run: |
          echo "official-staging CD only runs on refs/heads/official-staging"
          exit 1

  checks:
    if: github.ref == 'refs/heads/official-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm --prefix plugins/kaiyue-travel-staging ci
      - run: npm --prefix plugins/kaiyue-travel-staging run build
      - run: npm --prefix plugins/kaiyue-travel-staging test
      - run: pnpm build
        env:
          PUBLIC_SITE_URL: https://staging.kaiyuemacau.com
      - run: node scripts/official-staging-guard.mjs

  upload:
    needs: checks
    if: github.ref == 'refs/heads/official-staging'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      worker_version_id: ${{ steps.upload.outputs.worker_version_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PUBLIC_SITE_URL: https://staging.kaiyuemacau.com
      - id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/official-staging-upload.mjs

  verify:
    needs: upload
    if: github.ref == 'refs/heads/official-staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/official-staging-schema-check.mjs
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_VERSION_ID: ${{ needs.upload.outputs.worker_version_id }}
        run: node scripts/official-staging-candidate-check.mjs

  activate:
    needs: [upload, verify]
    if: github.ref == 'refs/heads/official-staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_VERSION_ID: ${{ needs.upload.outputs.worker_version_id }}
        run: node scripts/official-staging-activate.mjs
      - run: node scripts/official-staging-smoke.mjs
