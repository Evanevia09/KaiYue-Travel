name: CI

# GitHub Actions `CI` is this workflow. Cloudflare "Workers Builds: kaiyue-travel"
# is a separate GitHub check that uploads the production Worker. Do not retry
# that production build from a pull request. pull_request is listed for main and
# staging so a PR into staging still runs tests. workflow_dispatch is the
# operator fallback when a GitHub App event did not queue Actions.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_SITE_URL: https://example.invalid
